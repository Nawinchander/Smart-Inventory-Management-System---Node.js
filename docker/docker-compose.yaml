version: '3.8'

services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile

    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - mongodb
      - mysql

  mongodb:
    image: mongo

    ports:
      - "27017:27017"

  mysql:
    image: mysql

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: inventory

    ports:
      - "3306:3306"