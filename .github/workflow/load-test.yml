name: Load Testing

on:

  workflow_dispatch:

jobs:

  load-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run Load Tests
        run: |
          k6 run load-tests/product-load-test.js